<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tasks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #e9efee;
    --surface: #ffffff;
    --ink: #14212b;
    --muted: #55656f;
    --line: #c9d5d3;
    --accent: #0e7c6b;
    --accent-ink: #ffffff;
    --mark: #f5d547;
    --danger: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1a1f;
      --surface: #16252c;
      --ink: #e8f0ef;
      --muted: #9db0b6;
      --line: #2c4049;
      --accent: #3ec4ae;
      --accent-ink: #062621;
      --mark: #8a7a1c;
      --danger: #ff8a80;
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Source Sans 3", system-ui, sans-serif;
    font-size: 1.0625rem;
    line-height: 1.5;
    min-height: 100vh;
    padding: 2.5rem 1rem 4rem;
  }
  main { max-width: 38rem; margin: 0 auto; }

  header { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; margin-bottom: 1.5rem; }
  h1 {
    font-family: "Bricolage Grotesque", system-ui, sans-serif;
    font-weight: 800;
    font-size: clamp(2.5rem, 9vw, 3.75rem);
    letter-spacing: -0.03em;
    line-height: 1;
    margin: 0;
  }
  #remaining { color: var(--muted); font-weight: 600; margin: 0; white-space: nowrap; }

  .panel {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 0.75rem;
  }

  #unlock { padding: 1rem; margin-bottom: 1rem; }
  #unlock p { margin: 0 0 0.75rem; }
  #unlock form { display: flex; gap: 0.5rem; }

  #add-form { display: flex; gap: 0.5rem; margin-bottom: 1rem; }

  input[type="text"], input[type="password"] {
    flex: 1;
    min-width: 0;
    font: inherit;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 0.5rem;
    padding: 0.7rem 0.9rem;
  }
  input::placeholder { color: var(--muted); }
  input:disabled { opacity: 0.6; }

  button { font: inherit; cursor: pointer; }
  button:disabled { cursor: not-allowed; opacity: 0.6; }
  .primary {
    background: var(--accent);
    color: var(--accent-ink);
    border: 0;
    border-radius: 0.5rem;
    padding: 0.7rem 1.1rem;
    font-weight: 600;
  }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .filters { display: flex; gap: 0.25rem; margin-bottom: 0.75rem; }
  .filters button {
    background: transparent;
    color: var(--muted);
    border: 1px solid transparent;
    border-radius: 999px;
    padding: 0.3rem 0.85rem;
    font-weight: 600;
  }
  .filters button[aria-pressed="true"] {
    color: var(--ink);
    border-color: var(--ink);
  }

  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; align-items: center; gap: 0.75rem; padding: 0.8rem 1rem; border-bottom: 1px solid var(--line); }
  li:last-child { border-bottom: 0; }

  .check {
    appearance: none;
    flex: none;
    width: 1.5rem;
    height: 1.5rem;
    margin: 0;
    border: 2px solid var(--ink);
    border-radius: 0.3rem;
    background: var(--surface);
    display: grid;
    place-content: center;
    cursor: pointer;
  }
  .check::after {
    content: "";
    width: 0.75rem;
    height: 0.4rem;
    border-left: 3px solid var(--accent-ink);
    border-bottom: 3px solid var(--accent-ink);
    transform: translateY(-1px) rotate(-45deg) scale(0);
    transition: transform 0.12s ease-out;
  }
  .check:checked { background: var(--accent); border-color: var(--accent); }
  .check:checked::after { transform: translateY(-1px) rotate(-45deg) scale(1); }

  .text { flex: 1; overflow-wrap: anywhere; }
  /* Finished tasks are highlighted like marker pen instead of struck through */
  li.done .text {
    color: var(--muted);
    background: linear-gradient(transparent 55%, var(--mark) 55%);
    background-repeat: no-repeat;
    background-size: 100% 100%;
    display: inline;
    padding: 0 0.1em;
  }
  li.done .text-wrap { flex: 1; }

  .delete {
    flex: none;
    background: transparent;
    border: 0;
    color: var(--muted);
    border-radius: 0.4rem;
    width: 2rem;
    height: 2rem;
    font-size: 1.25rem;
    line-height: 1;
  }
  .delete:hover { color: var(--danger); }

  .empty { padding: 1.75rem 1rem; text-align: center; color: var(--muted); margin: 0; }

  footer { display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin-top: 0.75rem; min-height: 2rem; }
  #status { color: var(--muted); margin: 0; }
  #status.error { color: var(--danger); font-weight: 600; }
  #clear-done { background: transparent; border: 0; color: var(--muted); text-decoration: underline; padding: 0.25rem 0; }

  @media (prefers-reduced-motion: reduce) { .check::after { transition: none; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Tasks</h1>
    <p id="remaining" aria-live="polite"></p>
  </header>

  <section id="unlock" class="panel" hidden>
    <p>This list is view-only. Enter the edit password to add or change tasks.</p>
    <form id="unlock-form">
      <label for="password" class="sr" style="position:absolute;left:-9999px">Edit password</label>
      <input id="password" type="password" placeholder="Edit password" autocomplete="off">
      <button class="primary" type="submit">Unlock</button>
    </form>
  </section>

  <form id="add-form">
    <label for="new-task" style="position:absolute;left:-9999px">New task</label>
    <input id="new-task" type="text" placeholder="What needs doing?" maxlength="200" autocomplete="off">
    <button id="add-btn" class="primary" type="submit">Add task</button>
  </form>

  <div class="filters" role="group" aria-label="Filter tasks">
    <button type="button" data-filter="all" aria-pressed="true">All</button>
    <button type="button" data-filter="active" aria-pressed="false">To do</button>
    <button type="button" data-filter="done" aria-pressed="false">Done</button>
  </div>

  <div class="panel"><ul id="list"></ul></div>

  <footer>
    <p id="status" role="status" aria-live="polite">Loading tasks…</p>
    <button id="clear-done" type="button" hidden>Clear completed</button>
  </footer>
</main>

<script>
(function () {
  var API = "/api/tasks";
  var state = { tasks: [], filter: "all", password: "", writeProtected: false, busy: false };

  try { state.password = localStorage.getItem("todo-password") || ""; } catch (e) {}

  var $ = function (id) { return document.getElementById(id); };
  var listEl = $("list"), statusEl = $("status"), remainingEl = $("remaining");
  var addForm = $("add-form"), newTask = $("new-task"), addBtn = $("add-btn");
  var unlockPanel = $("unlock"), unlockForm = $("unlock-form"), passwordInput = $("password");
  var clearBtn = $("clear-done");

  function canEdit() { return !state.writeProtected || Boolean(state.password); }

  function setStatus(message, isError) {
    statusEl.textContent = message;
    statusEl.className = isError ? "error" : "";
  }

  async function request(method, payload) {
    var options = { method: method, headers: {} };
    if (payload) {
      options.headers["Content-Type"] = "application/json";
      options.headers["x-app-password"] = state.password;
      options.body = JSON.stringify(payload);
    }
    var res = await fetch(API, options);
    var data = await res.json().catch(function () { return {}; });
    if (!res.ok) {
      var err = new Error(data.error || "Request failed (" + res.status + ").");
      err.status = res.status;
      throw err;
    }
    return data;
  }

  async function load() {
    try {
      var data = await request("GET");
      state.tasks = data.tasks;
      state.writeProtected = data.writeProtected;
      setStatus("Saved to GitHub", false);
    } catch (err) {
      setStatus(err.message, true);
    }
    render();
  }

  async function send(payload, optimisticTasks) {
    if (!canEdit() || state.busy) return;
    state.busy = true;
    var before = state.tasks;
    if (optimisticTasks) { state.tasks = optimisticTasks; render(); }
    setStatus("Saving…", false);
    try {
      var data = await request("POST", payload);
      state.tasks = data.tasks;
      setStatus("Saved to GitHub", false);
    } catch (err) {
      state.tasks = before;
      if (err.status === 401) {
        state.password = "";
        try { localStorage.removeItem("todo-password"); } catch (e) {}
      }
      setStatus(err.message, true);
    }
    state.busy = false;
    render();
  }

  function visibleTasks() {
    return state.tasks.filter(function (t) {
      if (state.filter === "active") return !t.done;
      if (state.filter === "done") return t.done;
      return true;
    });
  }

  function emptyMessage() {
    if (state.tasks.length === 0) return "No tasks yet. Add your first one above.";
    if (state.filter === "active") return "Nothing left to do.";
    return "No completed tasks yet.";
  }

  function render() {
    var editable = canEdit();
    unlockPanel.hidden = editable;
    newTask.disabled = !editable;
    addBtn.disabled = !editable;

    var open = state.tasks.filter(function (t) { return !t.done; }).length;
    remainingEl.textContent = open + " to do";
    clearBtn.hidden = !state.tasks.some(function (t) { return t.done; }) || !editable;

    listEl.textContent = "";
    var items = visibleTasks();
    if (items.length === 0) {
      var li = document.createElement("li");
      var p = document.createElement("p");
      p.className = "empty";
      p.style.width = "100%";
      p.textContent = emptyMessage();
      li.appendChild(p);
      listEl.appendChild(li);
      return;
    }

    items.forEach(function (task) {
      var li = document.createElement("li");
      if (task.done) li.className = "done";

      var box = document.createElement("input");
      box.type = "checkbox";
      box.className = "check";
      box.checked = task.done;
      box.disabled = !editable;
      box.setAttribute("aria-label", "Mark done: " + task.text);
      box.addEventListener("change", function () {
        send({ action: "toggle", id: task.id }, state.tasks.map(function (t) {
          return t.id === task.id ? Object.assign({}, t, { done: !t.done }) : t;
        }));
      });

      var wrap = document.createElement("span");
      wrap.className = "text-wrap";
      wrap.style.flex = "1";
      var text = document.createElement("span");
      text.className = "text";
      text.textContent = task.text;
      wrap.appendChild(text);

      var del = document.createElement("button");
      del.type = "button";
      del.className = "delete";
      del.textContent = "\u00d7";
      del.disabled = !editable;
      del.setAttribute("aria-label", "Delete task: " + task.text);
      del.addEventListener("click", function () {
        send({ action: "delete", id: task.id }, state.tasks.filter(function (t) { return t.id !== task.id; }));
      });

      li.appendChild(box);
      li.appendChild(wrap);
      li.appendChild(del);
      listEl.appendChild(li);
    });
  }

  addForm.addEventListener("submit", async function (e) {
    e.preventDefault();
    var text = newTask.value.trim();
    if (!text) { setStatus("Type a task before adding it.", true); return; }
    newTask.value = "";
    await send({ action: "add", text: text });
    newTask.focus();
  });

  unlockForm.addEventListener("submit", function (e) {
    e.preventDefault();
    var value = passwordInput.value;
    if (!value) return;
    state.password = value;
    try { localStorage.setItem("todo-password", value); } catch (err) {}
    passwordInput.value = "";
    setStatus("Password saved. Your next change will confirm it.", false);
    render();
  });

  clearBtn.addEventListener("click", function () {
    send({ action: "clear_done" }, state.tasks.filter(function (t) { return !t.done; }));
  });

  document.querySelectorAll(".filters button").forEach(function (btn) {
    btn.addEventListener("click", function () {
      state.filter = btn.getAttribute("data-filter");
      document.querySelectorAll(".filters button").forEach(function (b) {
        b.setAttribute("aria-pressed", String(b === btn));
      });
      render();
    });
  });

  load();
})();
</script>
</body>
</html>
