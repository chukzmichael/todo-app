<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tasks</title>
<meta name="color-scheme" content="light dark">
<style>
:root{
  --bg:#f4f3fa; --surface:#ffffff; --ink:#22203a; --muted:#77748f; --line:#f06aa0;
  --accent:#5b5bf0; --accent-ink:#fff; --danger:#d6336c; --ring:#5b5bf0;
  --shadow:0 10px 24px -12px rgba(60,50,120,.28),0 2px 6px rgba(60,50,120,.06);
  --k0a:#ffc2b4; --k0b:#ff9c9c;
  --k1a:#d9e6ff; --k1b:#bcd2fb;
  --k2a:#fff3c4; --k2b:#ffe8a0;
  --k3a:#d8f4de; --k3b:#b9e8c6;
  --card-ink:#2a2140; --card-muted:rgba(42,33,64,.68);
  --sheet:0 30px 60px -20px rgba(30,20,80,.45);
  font-family:"Plus Jakarta Sans",ui-rounded,"SF Pro Rounded","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#14131f; --surface:#1e1d2e; --ink:#f0eefc; --muted:#9a97b5; --line:#e4699f;
    --accent:#7c7cff; --accent-ink:#12112a; --danger:#ff7aa8; --ring:#a5a5ff;
    --shadow:0 12px 26px -14px rgba(0,0,0,.7),0 2px 6px rgba(0,0,0,.3);
    --k0a:#6b3441; --k0b:#4f2733;
    --k1a:#2f3f6b; --k1b:#25335a;
    --k2a:#66592a; --k2b:#4e4421;
    --k3a:#2b5a3d; --k3b:#22472f;
    --card-ink:#f6f3ff; --card-muted:rgba(246,243,255,.72);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);min-height:100vh;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
.app{max-width:520px;margin:0 auto;padding:20px 18px 80px}

/* top bar */
.top{display:flex;align-items:center;gap:12px}
.icon-btn{width:44px;height:44px;border-radius:50%;border:0;background:var(--surface);box-shadow:var(--shadow);
  display:grid;place-items:center;flex:none}
.icon-btn svg{width:20px;height:20px}
.add{flex:1;height:48px;border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);
  font-weight:700;font-size:1rem;display:flex;align-items:center;justify-content:center;gap:8px;
  box-shadow:0 12px 22px -10px var(--accent)}
.add svg{width:18px;height:18px}

/* week */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:22px 0 6px}
.day{border:0;background:none;padding:8px 0 10px;border-radius:16px;display:flex;flex-direction:column;align-items:center;gap:4px;
  color:var(--muted);font-size:.72rem;font-weight:600;position:relative}
.day b{font-size:1.05rem;color:var(--ink);font-weight:700}
.day[aria-pressed="true"]{background:var(--ink);color:var(--bg);box-shadow:var(--shadow)}
.day[aria-pressed="true"] b{color:var(--bg)}
.day.today:not([aria-pressed="true"]) b{color:var(--line)}
.day i{width:5px;height:5px;border-radius:50%;background:var(--line);opacity:0}
.day.has i{opacity:1}
.scope{min-height:22px;font-size:.8rem;color:var(--muted);margin:0 2px 10px;display:flex;gap:8px;align-items:center}
.link{border:0;background:none;padding:0;color:var(--accent);font-weight:700;text-decoration:underline}

/* filters */
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}
.tabs{display:flex;background:var(--surface);border-radius:999px;padding:4px;box-shadow:var(--shadow)}
.tab{border:0;background:none;padding:7px 13px;border-radius:999px;font-size:.82rem;font-weight:600;color:var(--muted)}
.tab[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

/* banners */
.alert{background:color-mix(in srgb,var(--danger) 14%,var(--surface));color:var(--ink);border:1px solid var(--danger);
  border-radius:14px;padding:10px 14px;margin:0 0 14px;font-size:.9rem}
[hidden]{display:none!important}

/* timeline */
.timeline{list-style:none;margin:0;padding:0 0 0 34px;position:relative}
.timeline::before{content:"";position:absolute;left:8px;top:14px;bottom:14px;width:2px;border-radius:2px;background:var(--line);opacity:.75}
.item{position:relative;margin:0 0 14px}
.node{position:absolute;left:-34px;top:24px;width:18px;height:18px;border-radius:50%;background:var(--bg);
  border:2px solid var(--line);display:grid;place-items:center}
.item.done .node::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--line)}
.card{border-radius:24px;padding:16px 16px 12px;background:linear-gradient(140deg,var(--a),var(--b));
  color:var(--card-ink);box-shadow:var(--shadow)}
.k0{--a:var(--k0a);--b:var(--k0b)} .k1{--a:var(--k1a);--b:var(--k1b)}
.k2{--a:var(--k2a);--b:var(--k2b)} .k3{--a:var(--k3a);--b:var(--k3b)}
.head{display:flex;align-items:flex-start;gap:10px}
.check{flex:none;width:26px;height:26px;margin-top:-1px;border-radius:50%;border:2px solid currentColor;background:transparent;
  display:grid;place-items:center;color:var(--card-ink)}
.check svg{width:14px;height:14px;opacity:0}
.done .check{background:var(--card-ink);color:var(--card-ink)}
.done .check svg{opacity:1;color:var(--b)}
.title{flex:1;min-width:0;margin:0;font-size:1.05rem;font-weight:800;line-height:1.3;overflow-wrap:anywhere}
.stamp{flex:none;font-size:.78rem;font-weight:600;color:var(--card-muted);padding-top:3px;white-space:nowrap}
.desc{margin:6px 0 0 36px;font-size:.88rem;line-height:1.45;color:var(--card-muted);overflow-wrap:anywhere}
.done .title,.done .desc{text-decoration:line-through;opacity:.6}
.foot{display:flex;justify-content:flex-end;margin-top:4px}
.del{border:0;background:none;padding:6px 8px;border-radius:10px;font-size:.78rem;font-weight:700;color:var(--card-muted);
  display:flex;align-items:center;gap:5px}
.del svg{width:14px;height:14px}
.del:hover{color:var(--card-ink)}
.empty{text-align:center;color:var(--muted);padding:36px 10px;font-size:.95rem}
.ghost{border:1px solid var(--muted);background:none;border-radius:999px;padding:7px 14px;font-size:.82rem;font-weight:700;color:var(--muted)}
.ghost:hover:not(:disabled){color:var(--ink);border-color:var(--ink)}

/* form controls + dialog */
input,textarea{width:100%;background:var(--bg);border:1.5px solid transparent;border-radius:14px;padding:12px 14px;
  outline:0}
input:focus-visible,textarea:focus-visible{border-color:var(--ring);outline:0;box-shadow:0 0 0 3px color-mix(in srgb,var(--ring) 30%,transparent)}
textarea{resize:vertical;min-height:84px}
dialog{border:0;padding:0;background:var(--surface);color:var(--ink);border-radius:28px;width:min(440px,calc(100% - 28px));box-shadow:var(--sheet)}
dialog::backdrop{background:rgba(20,15,50,.5)}
dialog form{padding:22px 20px 20px;display:grid;gap:14px}
dialog h2{margin:0;font-size:1.25rem}
label{display:grid;gap:6px;font-size:.82rem;font-weight:700;color:var(--muted)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:4px}
.btn{border:0;border-radius:999px;padding:11px 20px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.btn.sec{background:var(--bg);color:var(--ink)}
@media (prefers-reduced-motion:no-preference){
  .card,.add,.tab,.day,.check{transition:transform .15s ease,background-color .2s ease,box-shadow .2s ease}
  .add:active,.check:active{transform:scale(.96)}
  dialog[open]{animation:pop .2s ease}
  @keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media (max-width:360px){.stamp{font-size:.72rem}.tab{padding:7px 10px}}
</style>
</head>
<body>
<main class="app">
  <div class="top">
    <button class="icon-btn" id="back" aria-label="Go back" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <button class="add" id="addBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      Add Task
    </button>
  </div>

  <nav class="week" id="week" aria-label="This week"></nav>
  <div class="scope" id="scope"></div>

  <div class="alert" id="error" role="alert" hidden></div>

  <div class="bar">
    <div class="tabs" role="group" aria-label="Filter tasks" id="tabs">
      <button class="tab" data-f="all" type="button">All</button>
      <button class="tab" data-f="todo" type="button">To do</button>
      <button class="tab" data-f="done" type="button">Done</button>
    </div>
    <button class="ghost" id="clearBtn" type="button">Clear done</button>
  </div>

  <ol class="timeline" id="list" aria-live="polite"></ol>
  <p class="empty" id="empty" hidden></p>
</main>

<dialog id="dlg" aria-labelledby="dlgTitle">
  <form id="addForm" method="dialog">
    <h2 id="dlgTitle">New task</h2>
    <label>Title
      <input id="fTitle" required maxlength="200" placeholder="What needs doing?">
    </label>
    <label>Description (optional)
      <textarea id="fDesc" maxlength="1000" placeholder="A few details"></textarea>
    </label>
    <div class="row">
      <label>Date <input type="date" id="fDate"></label>
      <label>Time <input type="time" id="fTime"></label>
    </div>
    <div class="alert" id="dlgError" role="alert" hidden></div>
    <div class="actions">
      <button class="btn sec" type="button" id="cancel">Cancel</button>
      <button class="btn" type="submit" id="save">Add task</button>
    </div>
  </form>
</dialog>

<script>
(function(){
  var API='/api/tasks';
  var $=function(id){return document.getElementById(id)};
  var tasks=[], filter='all', dayFilter='', busy=false;

  var DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  function key(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}

  function showError(msg){var e=$('error');e.textContent=msg||'';e.hidden=!msg;var d=$('dlgError');d.textContent=msg||'';d.hidden=!msg}
  function api(method,body){
    var opts={method:method,headers:{}};
    if(body){opts.headers['Content-Type']='application/json';opts.body=JSON.stringify(body)}
    var ctl=window.AbortController?new AbortController():null,timer=null;
    if(ctl){opts.signal=ctl.signal;timer=setTimeout(function(){ctl.abort()},25000)}
    return fetch(API,opts).finally(function(){clearTimeout(timer)}).catch(function(e){
      throw new Error(e&&e.name==='AbortError'?'The server took too long to respond. Try again.':'Could not reach the server. Check your connection and try again.');
    }).then(function(res){
      return res.json().catch(function(){return {}}).then(function(data){
        if(!res.ok||data.error) throw new Error(data.error||'Request failed ('+res.status+')');
        return data;
      });
    });
  }
  // Tolerate tasks saved in the old { id, text, ... } shape.
  function normalize(t){
    return {id:t.id,title:t.title!==undefined?String(t.title):String(t.text||''),
      description:t.description||'',date:t.date||'',time:t.time||'',
      done:!!t.done,createdAt:t.createdAt||''};
  }
  function apply(data){
    tasks=Array.isArray(data.tasks)?data.tasks.map(normalize):[];
    showError('');render();
  }
  function run(body){
    if(busy)return Promise.resolve(false);
    busy=true;render();
    return api('POST',body).then(function(d){apply(d);return true})
      .catch(function(e){showError(e.message||'Something went wrong.');return false})
      .then(function(ok){busy=false;render();return ok});
  }

  function fmtTime(t){
    if(!t)return'';var p=t.split(':'),h=+p[0],m=p[1]||'00';
    if(isNaN(h))return t;
    return ((h%12)||12)+':'+m+' '+(h<12?'AM':'PM');
  }
  function fmtDate(s){
    var p=(s||'').split('-');if(p.length!==3)return s||'';
    var d=new Date(+p[0],+p[1]-1,+p[2]);
    return d.toLocaleDateString(undefined,{month:'short',day:'numeric'});
  }
  function sortTasks(a,b){
    var ka=a.date?a.date+' '+(a.time||'99:99'):'~',kb=b.date?b.date+' '+(b.time||'99:99'):'~';
    if(ka!==kb)return ka<kb?-1:1;
    return String(a.createdAt||'')<String(b.createdAt||'')?-1:1;
  }
  function el(tag,cls,text){var n=document.createElement(tag);if(cls)n.className=cls;if(text!=null)n.textContent=text;return n}
  function svg(path,extra){
    var s=document.createElementNS('http://www.w3.org/2000/svg','svg');
    s.setAttribute('viewBox','0 0 24 24');s.setAttribute('fill','none');s.setAttribute('stroke','currentColor');
    s.setAttribute('stroke-width','3');s.setAttribute('stroke-linecap','round');s.setAttribute('stroke-linejoin','round');
    s.setAttribute('aria-hidden','true');
    var p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',path);s.appendChild(p);return s;
  }

  function renderWeek(){
    var w=$('week');w.textContent='';
    var now=new Date(),mon=new Date(now.getFullYear(),now.getMonth(),now.getDate()-((now.getDay()+6)%7));
    var today=key(now),withTasks={};
    tasks.forEach(function(t){if(t.date)withTasks[t.date]=1});
    for(var i=0;i<7;i++){
      var d=new Date(mon.getFullYear(),mon.getMonth(),mon.getDate()+i),k=key(d);
      var b=el('button','day'+(k===today?' today':'')+(withTasks[k]?' has':''));
      b.type='button';b.dataset.k=k;
      b.setAttribute('aria-pressed',String(dayFilter===k));
      b.setAttribute('aria-label',d.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'}));
      b.appendChild(el('span','',DAYS[d.getDay()]));
      b.appendChild(el('b','',String(d.getDate())));
      b.appendChild(el('i'));
      w.appendChild(b);
    }
  }

  function render(){
    renderWeek();
    var dis=busy;
    $('addBtn').disabled=dis;
    var done=tasks.filter(function(t){return t.done}).length;
    $('clearBtn').disabled=dis||!done;$('clearBtn').hidden=!done;

    Array.prototype.forEach.call($('tabs').children,function(b){
      var n=b.dataset.f==='all'?tasks.length:b.dataset.f==='done'?done:tasks.length-done;
      b.textContent=(b.dataset.f==='all'?'All':b.dataset.f==='todo'?'To do':'Done')+' '+n;
      b.setAttribute('aria-pressed',String(filter===b.dataset.f));
    });

    var sc=$('scope');sc.textContent='';
    if(dayFilter){
      sc.appendChild(el('span','','Showing '+fmtDate(dayFilter)));
      var lb=el('button','link','Show all dates');lb.type='button';
      lb.onclick=function(){dayFilter='';render()};sc.appendChild(lb);
    }

    var shown=tasks.filter(function(t){
      if(filter==='todo'&&t.done)return false;
      if(filter==='done'&&!t.done)return false;
      if(dayFilter&&t.date!==dayFilter)return false;
      return true;
    }).sort(sortTasks);

    var list=$('list');list.textContent='';
    shown.forEach(function(t,i){
      var li=el('li','item'+(t.done?' done':''));
      li.appendChild(el('span','node'));
      var card=el('article','card k'+(i%4));
      var head=el('div','head');
      var chk=el('button','check');chk.type='button';chk.disabled=dis;
      chk.setAttribute('role','checkbox');chk.setAttribute('aria-checked',String(!!t.done));
      chk.setAttribute('aria-label','Mark "'+t.title+'" as '+(t.done?'not done':'done'));
      chk.appendChild(svg('M5 12.5l4.5 4.5L19 7.5'));
      chk.onclick=function(){run({action:'toggle',id:t.id})};
      head.appendChild(chk);
      head.appendChild(el('h3','title',t.title||''));
      var stamp=[];
      if(t.date&&!dayFilter)stamp.push(fmtDate(t.date));
      if(t.time)stamp.push(fmtTime(t.time));
      if(stamp.length)head.appendChild(el('span','stamp',stamp.join(', ')));
      card.appendChild(head);
      if(t.description)card.appendChild(el('p','desc',t.description));
      var foot=el('div','foot');
      var del=el('button','del');del.type='button';del.disabled=dis;
      del.setAttribute('aria-label','Delete "'+t.title+'"');
      del.appendChild(svg('M6 6l12 12M18 6L6 18'));
      del.appendChild(document.createTextNode('Delete'));
      del.onclick=function(){run({action:'delete',id:t.id})};
      foot.appendChild(del);card.appendChild(foot);
      li.appendChild(card);list.appendChild(li);
    });
    var empty=$('empty');
    empty.hidden=shown.length>0||loading;
    empty.textContent=!tasks.length?'No tasks yet. Tap Add Task to create one.':'No tasks match this view.';
    list.style.display=shown.length?'':'none';
  }

  // events
  $('week').addEventListener('click',function(e){
    var b=e.target.closest('.day');if(!b)return;
    dayFilter=dayFilter===b.dataset.k?'':b.dataset.k;render();
  });
  $('tabs').addEventListener('click',function(e){
    var b=e.target.closest('.tab');if(!b)return;filter=b.dataset.f;render();
  });
  $('back').onclick=function(){if(history.length>1)history.back();else window.scrollTo(0,0)};
  $('clearBtn').onclick=function(){run({action:'clear_done'})};

  var dlg=$('dlg');
  function openDlg(){if(dlg.showModal)dlg.showModal();else dlg.setAttribute('open','')}
  function closeDlg(){if(dlg.close)dlg.close();else dlg.removeAttribute('open')}
  $('addBtn').onclick=function(){
    $('addForm').reset();$('fDate').value=dayFilter||'';
    showError('');openDlg();
    $('fTitle').focus();
  };
  $('cancel').onclick=closeDlg;
  $('addForm').addEventListener('submit',function(e){
    e.preventDefault();
    var title=$('fTitle').value.trim();if(!title){$('fTitle').focus();return}
    var body={action:'add',title:title};
    var d=$('fDesc').value.trim(),dt=$('fDate').value,tm=$('fTime').value;
    if(d)body.description=d;if(dt)body.date=dt;if(tm)body.time=tm;
    var save=$('save');save.disabled=true;save.textContent='Adding…';
    run(body).then(function(ok){
      save.disabled=false;save.textContent='Add task';
      if(ok)closeDlg();
    });
  });

  var loading=true;
  render();
  api('GET').then(apply).catch(function(e){showError(e.message||'Could not load tasks.')})
    .then(function(){loading=false;render()});
})();
</script>
</body>
</html>
